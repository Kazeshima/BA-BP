[package]
name = "ba-draft-tool"
version = "2.0.0"
description = "Blue Archive PvP ban/pick draft tool"
authors = ["Kazeshima"]
license = "MIT"
repository = "https://github.com/Kazeshima/BA-BP"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ba_draft_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release binary. Thin LTO keeps CI build times reasonable.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
